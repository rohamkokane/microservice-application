<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My tasks | Lumina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="dashboard-body">
    <header class="dashboard-header">
      <a class="dashboard-brand" href="dashboard.html"><span class="brand-mark">L</span> lumina</a>
      <div class="account-actions"><span id="user-name"></span><button id="logout" class="text-button">Sign out</button></div>
    </header>
    <main class="dashboard">
      <section class="dashboard-intro">
        <p class="eyebrow accent">YOUR TASKS</p>
        <h1>Focus on what matters.</h1>
        <p>Capture your next step, set its priority, and keep your day clear.</p>
      </section>
      <section class="task-workspace">
        <form id="task-form" class="new-task-form">
          <label class="sr-only" for="task-title">Task title</label>
          <input id="task-title" name="title" type="text" maxlength="140" placeholder="What needs your attention?" required />
          <label class="sr-only" for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="medium">Medium priority</option>
            <option value="high">High priority</option>
            <option value="low">Low priority</option>
          </select>
          <button class="add-task" type="submit">Add task <span>+</span></button>
        </form>
        <p id="task-message" class="task-message" role="status" aria-live="polite"></p>
        <div class="task-heading"><h2>My list</h2><span id="task-count">0 tasks</span></div>
        <ul id="task-list" class="task-list"></ul>
        <div id="empty-state" class="empty-state"><span>✓</span><h2>Your list is clear</h2><p>Add a task above to get started.</p></div>
      </section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
