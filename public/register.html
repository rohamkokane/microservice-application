<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Lumina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="welcome-panel" aria-label="Welcome">
        <a class="brand" href="index.html"><span class="brand-mark">L</span> lumina</a>
        <div class="panel-copy">
          <p class="eyebrow">START YOUR JOURNEY</p>
          <h1>Make space for your next idea.</h1>
          <p class="intro">Your focused workspace is just a few details away.</p>
        </div>
        <p class="quote">A thoughtful beginning makes all the difference.</p>
        <div class="orb orb-one"></div><div class="orb orb-two"></div><div class="grid-lines"></div>
      </section>
      <section class="login-panel">
        <div class="form-wrap">
          <p class="eyebrow accent">CREATE ACCOUNT</p>
          <h2>Join Lumina</h2>
          <p class="subtext">Create your account and start organizing with clarity.</p>
          <form id="register-form" novalidate>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="How should we call you?" autocomplete="username" required minlength="2" maxlength="40" />
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
            <label for="password">Password</label>
            <div class="password-field">
              <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
              <button class="toggle-password" type="button" aria-label="Show password">Show</button>
            </div>
            <button class="submit-button register-button" type="submit">Create account <span>→</span></button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          </form>
          <p class="signup">Already have an account? <a href="index.html">Sign in</a></p>
        </div>
      </section>
    </main>
    <script src="register.js"></script>
  </body>
</html>
