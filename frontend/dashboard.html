<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My tasks | Lumina</title><link rel="stylesheet" href="styles.css?v=2"></head><body><header class="dashboard-head"><a class="brand" href="dashboard.html"><span class="mark">L</span>Lumina</a><div class="account"><span id="name"></span><button id="logout" class="text-btn">Sign out</button></div></header><main class="dashboard"><span class="eyebrow accent">YOUR TASKS</span><h1>Focus on what matters.</h1><p class="sub">Capture your next step, set its priority, and keep your day clear.</p><section class="workspace"><form id="task-form" class="task-form"><input name="title" maxlength="140" placeholder="What needs your attention?" required aria-label="Task title"><select name="priority" aria-label="Priority"><option value="medium">Medium priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input name="deadline" type="date" aria-label="Deadline"><button class="primary" type="submit">Add task</button></form><p class="message"></p><div class="list-head"><h2>My list</h2><span id="count">0 tasks</span></div><ul class="tasks"></ul><div class="empty"><h2>Your list is clear</h2><p>Add a task above to get started.</p></div></section></main><script src="dashboard.js?v=4"></script></body></html>
